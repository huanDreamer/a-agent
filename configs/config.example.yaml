# huan-agent configuration template
# Copy to config.yaml and adjust as needed.
#
# Environment variable override:
#   HUAN_SERVER_HOST=0.0.0.0
#   HUAN_SERVER_PORT=9000
#   HUAN_LOGGING_LEVEL=debug
#   HUAN_LOGGING_FORMAT=json
#   HUAN_LLM_DEFAULT_PROVIDER=qwen
#   HUAN_LLM_PROVIDERS_DEEPSEEK_API_KEY=sk-...
#   HUAN_DATABASE_PATH=./data/huan-agent.db
#   HUAN_AGENT_MAX_STEPS=8
#   HUAN_SKILLS_DIR=./configs/skills

# Admin HTTP server (Phase 5): usage API, audit log, Prometheus metrics and the
# web UI. Run it with `huan-agent admin serve`.
server:
  host: "127.0.0.1"
  port: 8080
  enable: false            # opt in: the admin API exposes usage data
  session_ttl_minutes: 720 # how long a login lasts
  metrics_enable: true     # serve Prometheus metrics
  metrics_path: "/metrics"
  # Set the admin password hash with `huan-agent admin set-password`.
  # NEVER commit a real hash: use HUAN_ADMIN_PASSWORD_HASH instead.

logging:
  level: "info"      # debug | info | warn | error
  format: "console"  # console | json

database:
  path: "./data/huan-agent.db"

# LLM providers (OpenAI-compatible protocol).
# base_url and model default to the built-in tables when omitted (see
# internal/llm/registry.go). api_key can be empty for local providers like
# ollama. Set default_provider to pick one for `huan-agent chat`.
llm:
  default_provider: "deepseek"
  providers:
    deepseek:
      api_key: ""    # set via env: HUAN_LLM_PROVIDERS_DEEPSEEK_API_KEY
      # base_url defaults to https://api.deepseek.com/v1
      # model defaults to deepseek-chat
    qwen:
      api_key: ""
      # base_url defaults to https://dashscope.aliyuncs.com/compatible-mode/v1
      # model defaults to qwen-plus
    glm:
      api_key: ""
    openai:
      api_key: ""
    ollama:
      api_key: ""    # ollama ignores api_key but the field is required by config schema
      base_url: "http://localhost:11434/v1"
      model: "llama3.2"
      # Streaming asks for token usage via stream_options.include_usage. That is
      # an OpenAI extension; set this to true for a provider that rejects the
      # request, at the cost of getting no token counts on streamed calls.
      # disable_usage_request: false

  # Retrying a failed model call. A long turn makes hundreds of calls, so a
  # transient failure — a dropped connection, a 429, a 502 — is a matter of
  # when, not whether; without this, one of them ends the whole task.
  #
  # What is retried is decided by what the failure means, not by "is it an
  # error": timeouts, connection errors, 408/409/425/429 and 5xx are retried,
  # while a 400 / 401 / 403 / 404 / 422 (or an exhausted balance) fails
  # immediately — a second attempt would buy the same refusal.
  #
  # It applies to every model this process builds: the web chat, the Feishu bot,
  # the CLI REPL, the context condenser and the auto-title call.
  #
  # This is the retry for ONE model call. A stream that dies after the model has
  # already started answering is not repeated here (the reader has seen the
  # beginning of that answer); chat.step_retry below is what covers it.
  #   HUAN_LLM_RETRY_ENABLE=false
  #   HUAN_LLM_RETRY_MAX_ATTEMPTS=5
  retry:
    enable: true
    max_attempts: 3          # total attempts, including the first
    base_delay_ms: 800       # how long the first retry waits
    max_delay_ms: 30000      # ceiling for the exponential growth
    multiplier: 2.0          # how much each further wait grows
    jitter: true             # +/-25%, so parallel turns do not retry in lockstep

# Agent (ReAct loop) settings. Used by `huan-agent chat --tools` and by
# any platform integrations that build an agent.Agent.
agent:
  # Caps model→tool→model iterations for the ReAct CLI. Values above 200 are
  # clamped to it with a warning: this loop carries no token or time budget of
  # its own, so the step count is the only bound on a model that keeps calling
  # tools. Long tasks belong to the web/IM runner (chat.max_steps + the two
  # budgets above), which has all three.
  max_steps: 12
  # allowed_tools restricts which registered tools the LLM can call.
  # Empty list (default) = allow every registered tool.
  # Names must match the tools registered by the agent (built-ins:
  # time, calc, echo; MCP tools use their server-declared names).
  allowed_tools: []

# MCP (Model Context Protocol) servers. An entry declared here is mirrored
# into the database at startup so the console (设置 → MCP) lists it, and it is
# re-applied from this file on every start — which is why its console row is
# read-only apart from `enabled`. Servers added in the console live only in the
# database and are left alone by this sync.
#
# transport: "stdio" (default) | "sse" | "http"
#   * stdio spawns `command` with `args` and `env` ("KEY=value", merged onto the
#     process environment).
#   * sse / http dial `url` with `headers` ("Name: value", where a token goes).
mcp:
  servers: []
  # Example: filesystem MCP server (uvx-installed)
  # servers:
  #   - name: "fs"
  #     transport: "stdio"
  #     command: "uvx"
  #     args: ["mcp-server-filesystem", "/home/me/notes"]
  #     env: []
  #     enabled: true
  # Example: a hosted MCP server over SSE
  #   - name: "hosted"
  #     transport: "sse"
  #     url: "https://example.com/sse"
  #     headers: ["Authorization: Bearer "]

# Skills (markdown + YAML frontmatter) loaded by `huan-agent chat --skill <name>`.
skills:
  dir: "./configs/skills"

# Memory (Phase 3): short-term + long-term. Long-term entries are append-only
# JSONL files under `dir`, one per user/session namespace. Short-term keeps the
# most recent `max_turns` turns in memory.
#   HUAN_MEMORY_DIR=./data/memory
#   HUAN_MEMORY_ENABLE=true
#   HUAN_MEMORY_MAX_TURNS=20
memory:
  dir: "./data/memory"
  enable: true            # false disables memory in the chat loop
  max_turns: 20           # short-term buffer cap (most recent N turns)

# Context (Phase 3): token-budget + auto-compression so a long session doesn't
# blow up the LLM context window.
#   HUAN_CONTEXT_MAX_TOKENS=8000
#   HUAN_CONTEXT_KEEP_RECENT=10
#   HUAN_CONTEXT_SUMMARIZE=true
context:
  # 循环内的窗口预算（这一节的 auto 模式只作用于「轮内」这一遍）。
  #
  # 轮内压缩：talk 界面的每一轮里，每次模型调用之前压一次——这是长任务不会每步
  # 重发整段对话的原因。它永远逐字保留系统提示、最后一条用户消息和本轮台账，中间
  # 折成摘要。
  #
  # CLI（huan-agent chat）与飞书那种「整段对话」记忆窗口是另一遍，也用 max_tokens，
  # 但它没有模型可解析、也不带台账：那里 max_tokens 只认正数，0 和负数都等于关闭。
  #
  # max_tokens 的三种取值：
  #   0   = 按模型自己的上下文窗口算（默认）：窗口 × window_ratio − reserve_output_tokens。
  #         控制台同时服务多个模型，一个固定数字对它们必然有对有错。
  #   > 0 = 写死的上限，优先于一切。
  #   < 0 = 关闭压缩：每步重发整段历史，只有很短的轮次负担得起。
  max_tokens: 0
  window_ratio: 0.7       # 自动模式下历史可占窗口的比例（0 = 用默认 0.7）
  reserve_output_tokens: 8192  # 留给模型自己输出的空间；负数表示不留
  default_window: 131072  # 内置表不认识的模型按这个窗口估（0 = 用默认 128k）
  # 按模型覆盖窗口：key 是模型 id 的子串（不区分大小写，最长匹配优先）。
  # 网关提前截断、私有部署窗口更小的时候用它。
  model_windows: {}
  # 单次工具结果进入模型上下文的字符上限。这是对窗口影响最大的一个开关：
  # 一条输出 128 KiB 的命令会让窗口每两步就触发一次压缩，把正在做的事折掉。
  # 控制台里显示的、落库的都是完整输出，只有回放给模型的那份会被截断。
  # 0 = 用默认 16000；负数 = 不限制。
  tool_result_max_chars: 16000
  keep_recent: 12         # messages kept verbatim after a compression pass
  summarize: true         # use the LLM to summarize rolled-up turns (else drop + placeholder)

# Feishu (Lark) IM bot (Phase 4).
# Enable the bot by filling app_id / app_secret from the Feishu developer
# console (https://open.feishu.cn -> 开发者后台 -> 凭证与基础信息). Requires
# the "im:message" scopes and the im.message.receive_v1 event subscription.
# huan-agent uses the WebSocket long-connection so no public callback URL is
# needed. Leave app_id empty to keep the bot disabled.
#   HUAN_FEISHU_APP_ID=cli_xxx
#   HUAN_FEISHU_APP_SECRET=xxx
#   HUAN_FEISHU_DOMAIN=https://open.feishu.cn
feishu:
  # Multiple apps supported (like llm.providers). `active` picks one by name.
  # The legacy flat app_id/app_secret block still works when `active` is empty.
  active: "primary"     # which app in `apps` to run; empty = use app_id/app_secret below, or first `apps` entry
  apps:
    primary:
      app_id: "cli_xxx"
      app_secret: ""    # NEVER commit real secrets; set via env:
      # HUAN_FEISHU_APPS_PRIMARY_APP_SECRET=...
      domain: ""        # empty = Feishu default; use https://open.larksuite.com for Lark
      verification_token: ""
      encrypt_key: ""
      # transport: how events reach the bot.
      #   websocket (default) = long connection, needs no public URL
      #   callback            = HTTP server, needs a public URL in the console
      transport: "websocket"
      callback_addr: "0.0.0.0:8081"     # callback mode only
      callback_path: "/feishu/event"    # callback mode only
    secondary:
      app_id: "cli_yyy"
      app_secret: ""
      domain: "https://open.larksuite.com"   # Lark (international)
      verification_token: ""
      encrypt_key: ""
      transport: "websocket"

  # --- behavior (shared by all apps) ---
  # Send a "thinking…" card immediately and replace it with the answer when the
  # model finishes (Feishu has no streaming).
  thinking: true
  # Outbound resilience. attempts includes the first try; 0 disables retrying.
  retry_attempts: 3
  retry_base_delay_ms: 300     # exponential backoff start
  send_timeout_ms: 15000       # per-attempt timeout (0 = none)
  # Token-bucket rate limit for outbound sends (0 = unlimited).
  rate_limit_per_sec: 5.0
  rate_limit_burst: 10
  # Where inbound images/files are saved for the agent to read.
  # Empty = $TMPDIR/huan-agent-downloads
  download_dir: ""
  max_download_mb: 32          # per-attachment cap

  # Give the bot the file/search/command tools, confined to the workspace the
  # sender selected (see 设置 → 工作区 and docs/tools.md).
  #
  # SECURITY: anyone who can message the bot can then read, write and execute
  # inside a workspace, and `bash` can still reach absolute paths elsewhere on
  # the machine. Set false to keep the bot conversational, or point it at a
  # read-only workspace.
  enable_tools: true

  # Legacy single-app form (alternative to `apps` + `active`):
  # app_id: "cli_xxx"
  # app_secret: ""
  # domain: ""

# Cost estimation (Phase 5). Prices are USD per 1000 tokens.
# Keys may be "provider/model" (most specific), "model", or "provider";
# the most specific match wins, otherwise `fallback` applies.
pricing:
  fallback:
    prompt_per_1k: 0.0
    completion_per_1k: 0.0
  models:
    deepseek/deepseek-chat:
      prompt_per_1k: 0.00014     # cache miss
      completion_per_1k: 0.00028
    qwen/qwen-plus:
      prompt_per_1k: 0.0004
      completion_per_1k: 0.0012
    glm/glm-4-plus:
      prompt_per_1k: 0.0007
      completion_per_1k: 0.0007
    openai/gpt-4o-mini:
      prompt_per_1k: 0.00015
      completion_per_1k: 0.0006
    # ollama is local: no cost
    ollama:
      prompt_per_1k: 0.0
      completion_per_1k: 0.0

# Admin login (Phase 5). Single-user password auth.
admin:
  # This is a single-user local console, so there is no login by default: the
  # only way in is loopback and a password you retype on every restart is
  # friction with nothing to protect.
  #
  # Turning this on is what makes the web console show its login screen: the
  # console asks GET /api/me for `login_required` before it draws anything, so a
  # login-free deployment never sees a password form. Sessions live in the
  # server's memory — a restart logs everyone out.
  require_login: false
  username: "admin"
  # bcrypt hash; only needed when require_login is true. Generate and set it:
  #   huan-agent admin set-password
  # or via env: HUAN_ADMIN_PASSWORD_HASH
  password_hash: ""
  # The password is asked of callers that are NOT on this machine: a request
  # arriving over the loopback interface (127.0.0.1 / ::1) is treated as already
  # authenticated, even with require_login: true. The decision comes from the
  # socket's peer address, never from X-Forwarded-For, so a remote caller cannot
  # claim to be local by sending a header.
  #
  # Set this to false if a reverse proxy, an SSH tunnel or a container
  # port-forward is what reaches the server: those clients arrive from 127.0.0.1
  # too and would skip the password, which would leave require_login protecting
  # nothing. The server logs a warning at startup while this is on.
  trust_loopback: true
  # The agent's tools can read, write and EXECUTE, so a login-free admin on a
  # non-loopback address would be a remote shell. The server therefore refuses
  # to start with that combination. Set this only when something else
  # authenticates in front (a reverse proxy, a VPN, an SSH tunnel).
  allow_insecure_bind: false

# Web chat in the admin UI (requires `huan-agent admin serve`).
#
# These are *startup defaults*. The console's 设置 → 对话预算 overrides them, per
# field, and the override is stored in the database (app_settings) and read
# per turn — so a change applies to the next message with no restart. 恢复默认 in
# that panel hands a field back to the value below.
chat:
  enable: true             # off = the chat tab is hidden
  max_steps: 60            # tool-calling iterations per turn (> 500 is refused)
  turn_max_tokens: 6000000 # per-turn token budget; 0 = unlimited. With in-turn
                           # compression on, a 60-step turn costs roughly 1~2M, so a
                           # cap below that stops turns that are behaving normally.
  turn_deadline_seconds: 10800 # per-turn wall-clock budget, 3h; 0 = unlimited
  history_limit: 40        # stored messages replayed to the model
  system_prompt: ""        # empty = the built-in Chinese general-purpose agent
                           # prompt in internal/prompt (see docs/prompt.md); a value
                           # here replaces it in the web console and in the Feishu
                           # bot (the CLI uses --system / --skill instead)
  # 循环保护：一轮里"没有失败但也没有进展"的两种情形——同一个调用反复重放、
  # 一直只看不动手。步数/token/时间三个预算都看不见这两种，它们只会安静地把整轮
  # 预算烧光。保护先提醒、再收手：先给模型一条说明（它通常会改做法），只有它继续
  # 打转才结束这一轮。
  guard:
    enable: true
    repeat_nudge: 3        # 同一个工具+同一份参数重复几次开始提醒
    repeat_stop: 5         # 重复几次结束这一轮（只对只读调用生效）
    idle_nudge_steps: 25   # 连续多少步没有任何改动开始提醒
    idle_stop_steps: 75    # 连续多少步没有改动结束这一轮（会先提醒过）
    max_steers: 6          # 一轮最多注入多少条提醒

  # ask_user 的交互卡片等多久算超时（秒）；0 = 默认 600。
  # 等待发生在这一轮之内，所以要明显小于 turn_deadline_seconds，否则等到答案时
  # 这一轮已经没有预算继续了。超时不算失败：模型收到「用户没有回答」后自行收口。
  ask_user_timeout_seconds: 600

  # 单步重试：某一步的模型调用失败后，从同一份历史重跑这一步。它管的是
  # llm.retry 管不了的那种失败——流已经吐出一半才断。此时 llm 层刻意不重试
  # （重放会让读者看到两遍同一句话的开头），由这里重跑，并先发一个 step_retry
  # 事件让界面丢掉那半截文本。
  #
  # 退避时间与 llm.retry 同形，只是更长：一次重试后面往往还跟着一轮工具调用。
  # 注意两层会相乘：最坏情况下一步的模型调用次数 = llm.retry.max_attempts ×
  # step_retry.max_attempts（默认 3 × 3），而且只在连续失败时才会发生。
  step_retry:
    enable: true
    max_attempts: 3          # 这一步最多跑几次（含第一次）
    base_delay_ms: 1500
    max_delay_ms: 20000
    multiplier: 2.0
    jitter: true

  # 任务计划：模型通过 plan_create / plan_add / plan_update / plan_read 维护一份
  # 任务清单，控制台把它画在输入框上方（任务看板：执行中 / 待执行 / 已完成），
  # 并落库到 chat_plans。任务被中断后点「继续执行」，新一轮会带着这份计划与上一轮
  # 已完成的步骤接着跑，而不是从零重来。
  #
  # 关掉之后 plan_* 工具不再注册（提示词里也就不会有它们），看板自然不出现；
  # 已经存在的计划仍会被「继续执行」读取，因为它是接续点的来源。
  plan:
    enable: true
    max_tasks: 50            # 一份计划最多几条；超出的调用被拒绝而不是被截断

# 一次性运行：`huan-agent run "<prompt>"`。给 git hook / CI / cron 用的入口——没有
# 终端、没有人看着、也没有人在中途回答问题。答案是逐块写到 stdout 的，日志与进度
# 全部写 stderr，所以输出可以直接接进管道：
#
#   huan-agent run "读一下 README.md，一句话说这个项目是什么"
#   git diff --cached | huan-agent run - "审一遍下面这段 diff"
#   huan-agent run "..." --output json | jq -r .answer
#
# 退出码是它与 shell 的契约（0 跑完 / 1 模型或循环失败 / 2 用法错误 / 3 超时 /
# 4 预算耗尽 / 5 工具失败且设了 --fail-on-tool-error / 6 配置问题），详见 docs/run.md。
#
# 它默认带工具，但按 surface 裁掉两样：ask_user（没有可以回答的地方）与后台进程
# 工具（退出后没人管那些进程；--allow-background 才给，且退出前一律停掉）。
run:
  timeout_seconds: 0       # 整轮墙钟预算；0 = 不限（与 chat.turn_deadline_seconds 同义）
  max_steps: 0             # 0 = 继承 chat.max_steps，让两种跑法的上限不会各自漂移
  default_output: "text"   # text = stdout 上只有答案；json = 一个对象

# 长任务（几十步、十几分钟）：这几个开关要一起调，别只调 max_steps ——
# 只把步数调大的结果是每一步都重发整段历史，token 成本近似平方增长，
# 最后撞模型上下文上限报错；循环内压缩才是让它跑完的那一半（默认已开启）。
#
#   chat:
#     max_steps: 60
#     turn_max_tokens: 6000000      # 这一轮最多烧多少 token（压缩开启后按 1~2M/60 步估）
#     turn_deadline_seconds: 3600   # 这一轮最多跑多久
#     guard:                        # 只读不改 / 反复重放时先提醒、必要时收手
#       enable: true
#       repeat_nudge: 3             # 同一个只读调用重复几次开始提醒
#       repeat_stop: 5              # 重复几次收手（0/负值会被抬到 nudge+1）
#       idle_nudge_steps: 25        # 连续多少步没有任何改动开始提醒
#       idle_stop_steps: 75         # 连续多少步没有改动收手（低于 nudge 时按 nudge×3 计）
#       reread_nudge: 5             # 同一个文件「同一种读法」读几次开始提醒
#       max_steers: 6               # 一轮最多注入多少条提醒
#   context:
#     max_tokens: 0                 # 0 = 按模型窗口自动（>0 写死，<0 关闭压缩）
#     window_ratio: 0.7             # 自动模式下历史可占窗口的比例
#     reserve_output_tokens: 8192   # 留给模型输出的空间
#     tool_result_max_chars: 16000  # 单条工具结果进入上下文的上限（负值 = 不限）
#     model_windows: {}             # 按模型 id 子串覆盖窗口，例如 { deepseek: 65536 }
#     keep_recent: 12               # 最近几步逐字保留，更早的折叠成摘要
#     summarize: true
#   tools:
#     bash_timeout_seconds: 300     # 单条命令默认给多久
#     bash_max_timeout_seconds: 1800  # 模型用 timeout_ms 最多能要到多久
#
# 停因不会被吞掉：到预算就收口，回答里写明是哪一个预算用尽，控制台给这一轮打标记，
# 日志里有一条 warn（reason / steps / tokens / elapsed）。详见 docs/long-tasks.md。
#
# 跑不完也不再等于白跑：模型先建计划（任务看板就在输入框上方），单次模型调用失败
# 按 llm.retry 退避重试，流断在中途按 chat.step_retry 重跑那一步；两层都失败时，
# 用户点「继续执行」——新一轮带着计划、上一轮已完成的步骤与工具观察接着做，不重头思考。

# Langfuse tracing. Traces every chat turn: model generations (with token
# usage) and tool calls, viewable in the admin UI's 链路追踪 tab and in
# Langfuse itself.
langfuse:
  enable: false            # requires host + keys below
  host: "https://cloud.langfuse.com"   # or a self-hosted URL
  public_key: ""           # NEVER commit; use HUAN_LANGFUSE_PUBLIC_KEY
  secret_key: ""           # NEVER commit; use HUAN_LANGFUSE_SECRET_KEY
  environment: "production"
  release: ""              # e.g. a git sha; empty = omitted

# Tools that let the agent work on a codebase: read/write/edit files, search
# them, and run commands. See docs/tools.md.
#
# SECURITY: this lets an LLM touch a real directory and run real commands, and
# anyone who can message the bot can drive it. The WORKING DIRECTORY is
# confined; what a command can otherwise reach is not. For a real boundary, run
# the agent as a dedicated user in a container with only the project mounted.
tools:
  # The first workspace: the directory the agent works in until other workspaces
  # are set up in the console (left sidebar → 新建工作区). Empty = the process
  # working directory.
  #
  # Every conversation belongs to a workspace, and a workspace is a directory you
  # pick — so this is a starting point, not a global setting. See
  # docs/tools.md → Workspaces.
  workspace: ""              # e.g. "/Users/me/code/my-project"
  # Read and search only: write_file, edit_file, bash and generate_image are not
  # registered at all. Process-wide: it applies to every workspace.
  read_only: false
  # Shell execution. Off = file editing without command execution.
  enable_bash: true
  bash_timeout_seconds: 120
  # The ceiling a single call may raise its own timeout to with timeout_ms: a
  # long build or a full test suite can ask for more time for that call without
  # changing the default every other command waits under. A value below
  # bash_timeout_seconds is raised to it, since a ceiling under the default
  # would make the default itself unreachable. 0 = the default (900s).
  bash_max_timeout_seconds: 900
  # Background processes (bash_background / bash_jobs / bash_output / bash_stop):
  # dev servers, --watch builds, resident APIs and databases. A `bash` call still
  # kills what it started; these tools are the explicit way to start something
  # that outlives the call. Off = the four tools are not registered at all.
  # They also require enable_bash: starting a resident process is still running a
  # command.
  enable_background: true
  # Where job logs are written. Empty = a "jobs" directory beside the database
  # file. Logs live with the deployment's data rather than in a workspace, so they
  # do not turn up in the model's own searches or in your git status.
  background_dir: ""
  # How many background jobs may run at once; starting one more is refused with a
  # message that says so.
  background_max_jobs: 8
  # Per-job caps: the log file stops at background_log_max_mb (and says so in the
  # file), and the in-memory tail a reader is served from is background_window_kb.
  # Neither grows with how long the process runs.
  background_log_max_mb: 8
  background_window_kb: 256
  # SIGTERM-to-SIGKILL grace when stopping a job. Generous on purpose: a database
  # flushes on SIGTERM and losing that is worse than waiting.
  background_stop_grace_seconds: 5
  # 工具并发：同一个模型回复里的多个调用，只有**声明自己 ParallelSafe** 的才会重叠执行。
  #
  # 它不是"一次能跑多少个工具"，而是"一次能重叠多少 I/O"：写与执行永远是屏障（barrier）——
  # 它们之前的调用先做完，它们之后的调用等它们做完。这是模型写下的程序顺序，不是性能取舍：
  # 「先写配置，再跑测试」被重排就会在旧配置上测试。
  #
  # 默认 4：一个"同时读五个文件"的步骤是它存在的主要场景，4 个重叠已经把延迟压到一次读加上
  # 一点点；再高主要是多开文件描述符。0 或 1 表示逐个执行，也就是这个功能之前的全部行为。
  max_parallel: 4

  # Per-call limits.
  max_read_kb: 512
  max_write_mb: 4
  max_list_entries: 500
  # RE2 patterns that refuse a matching command; empty uses the built-in set
  # (rm -rf /, mkfs, dd of=/dev/..., fork bombs, shutdown/reboot). This is a
  # speed bump, NOT a boundary — an equivalent command that does not match runs.
  deny_patterns: []

  # 读网页：fetch_url 抓取一个 URL、抽掉导航与脚本、把可读正文交给模型。
  #
  # 没有它，模型的替代品是 curl —— 一个现代文档页面几百 KB 的 HTML 里正文很少，
  # 进到上下文里的是被截断的壳。抓取 + 抽取正文就是它全部的价值。
  #
  # **地址检查是安全边界，不是功能**：模型可以要求任意 URL，没有检查的话
  # http://169.254.169.254/（云元数据，会交出实例凭据）、http://127.0.0.1:1933/（本机
  # OpenViking）和 http://10.0.0.1/ 都是可达的。检查在**每一次重定向**与**建立连接时**
  # 各做一次，因为 302 与 DNS rebind 正是"只检查一次"的两种经典绕过方式。
  web:
    enable: true
    allow_private: false      # true 会同时放开云元数据地址与本机服务，启动时会打一条 warn
    timeout_seconds: 20
    max_kb: 2048              # 响应体上限，边读边计数（不是读完再判断）
    max_chars: 20000          # 单次调用返回的正文上限；更长的用 offset 分页读
    cache_ttl_seconds: 300    # 进程内缓存；0 = 用默认，负数 = 关闭
    user_agent: ""            # 空 = 默认标识

  # 子 agent：模型可以把一个问题交给一个嵌套的 agent，只拿回一份有界报告。
  #
  # 它买的是**上下文隔离，不是算力**：为了回答一个问题而 grep 二十次、读三十个文件，这些工具结果
  # 原本会留在主轮次的窗口里，把真正要改的代码挤出去。子 agent 有一个可以随便脏的窗口，代价是一次
  # 额外的模型调用序列。
  #
  # 三个默认值都是"bound 成本"而不是"开关功能"，因为这个功能的风险就是成本：
  #   - 报告有界：只有最终结论（截断）加一段结构化尾注跨回来，中间的工具结果和思考都留在它自己那边；
  #   - 能力收窄：默认只有**只读且可并行**的工具。写/执行必须显式列出才授予，而且仍然经过父轮次的
  #     审批闸门、检查点与工作区沙箱——子 agent 不是绕过它们的路；
  #   - 费用归父轮次：token 与墙钟计入发起它的那一轮，并共享那一轮的 deadline。
  #
  # 三个工具永远不授予：ask_user（子 agent 没有通向人的通道，卡片只会挂着）、plan_*（计划属于顶层
  # 轮次，子 agent 改看板会让用户看到不属于自己的进度）、spawn_agent（深度上限 1）。
  subagent:
    enable: true
    max_steps: 0             # 0 = 与派它的那一轮用同样的步数预算（chat.max_steps，含控制台覆盖）
                             # 正数 = 给所有子 agent 一个统一上限。默认继承，因为子 agent 干的往往是
                             # "把这块代码读清楚"这种活，8 步连文件都读不完：真实一轮里两个侦察子 agent
                             # 都在第 8 步被截断，父轮次只好自己再读一遍，白花一次调用
                             # 子 agent 同样受循环保护与上下文压缩约束（同一份 chat.guard / context.*）
    max_concurrent: 2        # 全进程同时最多几个；"同时探三条路"是它的用法，四个父轮次各派四个就是账单
                             # 拿不到槽位的那个排队而不是失败，控制台的顶部状态栏会说还有几个在等
    max_report_chars: 8000   # 报告截断上限；截断会如实说明

  # 审批闸门：写/执行类工具调用落地之前，先让人决定。
  #
  # **默认为 off**，这是刻意的：默认打开会从"没人在看"的部署（CI、cron、飞书机器人）
  # 手里拿走写权限，那个意外比没有闸门更糟。打开它是一次显式的决定，代价是某些
  # surface 随后会失去写工具 —— 见下面的 mode 说明。
  #
  # 与 ask_user 的关键区别：**超时按拒绝处理**。提问超时是"模型拿不到信息"，它自己
  # 决定下一步；审批超时是"没人在看"，而没人在看恰恰是闸门必须生效的时刻。
  approval:
    mode: "off"              # off | writes | writes+exec | all
    allow: []                # 按动作摘要匹配的 RE2；命中即免审批。与 deny_patterns
                             # 一样是减速带不是边界，但这里默认是"问"，所以漏一条
                             # 的代价是一次询问，而不是一次事故。
    timeout_seconds: 300     # 单次等待上限；超时=拒绝
    # mode 非 off 时各 surface 的行为：
    #   Web 控制台  → 弹出审批卡片，允许一次 / 本轮允许 / 拒绝
    #   交互式 CLI  → 终端上 y（一次）/ t（本轮）/ n 或直接写拒绝理由
    #   飞书 / run  → **不给**写与执行工具（没有可以询问的地方）。一个必然失败的工具
    #                 比没有这个工具更糟，所以是"不在菜单上"而不是"每次都被拒"。

  # 检查点：每一轮里被文件工具改过的文件，在改动之前留有原样副本，可以整体回退。
  #
  # 覆盖范围是**通过文件工具的改动**。bash 造成的改动（rm、sed -i、构建产物）不在
  # 其中——那需要整仓快照，成本与收益不成比例。作为补偿，检查点也记录轮次开始与结束
  # 时的 git status，所以 bash 动了什么仍然看得见。
  checkpoint:
    enable: true
    dir: ""                  # 空 = 数据库文件旁的 checkpoints 目录
    keep_turns: 20           # 每个会话保留最近多少轮；更旧的先淘汰
    max_total_mb: 512        # 整个检查点目录的上限

  # 产物：智能体在执行过程中交出来的资源——网页、报告、图片——不是代码，也不是
  # 项目文档。它们**存在服务端自己的目录里**，不在任何工作区里，因为产物的意义之一
  # 就是工作区消失之后还能打开它。
  #
  # 与附件的区别：附件是人上传的、放在工作区里、会话是它可访问的前提；产物是智能体
  # 写出来的，路径（path）就是它的地址，服务端把它按 URL 送出去。
  #
  # 三个工具面的差别：
  #   控制台（对话）→ save_artifact 存进本会话，顶栏的「产物」按钮列出本会话全部产物，
  #                    统计监控 → 产物中心 列出全部会话的产物；
  #   CLI（huan-agent chat）→ 同样存在服务端，但没有 URL 可给（那个进程不起 HTTP 服务），
  #                    所以工具只回报文件路径，控制台仍然列得出来；
  #   run（一次性）→ 上面的都成立，只是没有会话，产物因此没有归属（产物中心会明确说）。
  #
  # 文件类型是白名单：html / md / txt / csv / json / xml / png / jpg / gif / webp / pdf。
  # 不在白名单里的扩展名会被拒绝，而不是存下来再想怎么办。
  artifacts:
    enable: true
    root: ""                 # 空 = 数据库文件旁的 artifacts 目录
    # 默认 false：产物的字节由模型写、由模型的输入决定，所以要登录才拿得到。
    # 打开它意味着**任何知道链接的人**都能读到智能体写出来的东西（含它在工作区里读到、
    # 又写进页面的内容）；绑定在非 loopback 地址上时启动会打一条 warn。
    public_urls: false
    max_bytes: 0             # 单个产物上限；0 = 32 MiB

  # 代码智能：接语言服务器，给模型四个只读工具——diagnostics（诊断）、
  # goto_definition（跳转）、find_references（引用）、workspace_symbols（符号搜索）。
  #
  # 它们回答的是 grep 回答不了的问题：grep 匹配字符串，这些工具问编译器——
  # 「这个接口有几个实现」「改这个签名要动哪些调用点」。漏掉一个调用点不会报错，
  # 只会留下半个编译不过的仓库，所以「谁在用这个符号」需要精确答案。
  #
  # attach_diagnostics 是另一半，而且是最常起作用的那一半：改完文件之后，把该文件的
  # 诊断附在工具结果里。于是「改完 → 跑测试 → 发现类型错 → 再改」这个循环被砍成
  # 「改完就知道」。它不是模型要主动调用的工具——在「我觉得改对了」的心态下，
  # 需要主动调用的检查不会被调用。
  lsp:
    enable: true                 # 关掉后不启动任何进程、不注册任何工具、编辑结果不变
    attach_diagnostics: true     # 写/编辑成功后附上该文件的诊断
    diagnostics_wait_ms: 2000    # 等诊断稳定的上限；超时如实报「尚未就绪」，编辑照常成功
    idle_timeout_seconds: 600    # 空闲多久回收语言服务器进程；-1 = 从不回收
    max_diagnostics: 20          # 单次附给模型的条数上限；总数始终会说明，不静默截断
    # 语言服务器表。留空使用内置默认（Go 用 gopls）。语言既可以写扩展名（.go）
    # 也可以写语言 id（go）；root_markers 决定服务器索引哪个项目——最近的含标记文件
    # 的祖先目录会成为它的 root，这直接决定「找不到引用」是一个答案还是一个错误。
    #
    # 注意 gopls 是外部二进制：没装的话这四个工具**不会注册**（一个必然失败的工具
    # 比没有这个工具更糟），日志里会给出安装命令：
    #   go install golang.org/x/tools/gopls@latest
    servers: []
    # servers:
    #   - name: "gopls"
    #     command: "gopls"
    #     args: ["-mode=stdio"]
    #     languages: ["go"]
    #     root_markers: ["go.mod", "go.work"]
    #   - name: "typescript"
    #     command: "typescript-language-server"
    #     args: ["--stdio"]
    #     languages: ["typescript", "javascript", ".ts", ".tsx", ".js", ".jsx"]
    #     root_markers: ["package.json", "tsconfig.json"]

# ---------------------------------------------------------------------------
# Media tools and model management
#
# Providers can now be managed at runtime from the console (设置 → 模型管理):
# add a provider, fetch its model list from the OpenAI-compatible /models
# endpoint, declare what each model can do, and bind a model to each capability.
# Those live in the database. Anything declared below is synced into the
# database at startup and shown read-only in the console, so the config stays
# useful for a declarative bootstrap.
#
# A media tool exists only when its capability is bound to a usable model.
# Unbound capability = the tool is not registered at all, so the model cannot
# even see it.
# ---------------------------------------------------------------------------
# Capabilities and the tools they enable:
#   vision            → describe_image    (send an image to a vision model)
#   image_gen         → generate_image    (generate an image into the workspace)
#   audio_transcribe  → transcribe_audio  (speech to text)
#   audio_speech      → reserved; no tool ships yet
#   embedding         → reserved; no tool ships yet
#
# NOTE the /models endpoint does not report capabilities — it returns ids only.
# The console guesses from the model name and lets you correct it, which is the
# only accurate source.

# ---------------------------------------------------------------------------
# OpenViking — context database for long-term memory and documents
#
# OpenViking (https://github.com/volcengine/OpenViking) is an agent-native
# context database: it stores memory and documents under viking:// URIs and
# answers semantic queries over them. Install it (`uv tool install openviking`,
# then `ov system ...` starts the server on 127.0.0.1:1933) and turn this on; the
# whole integration is off unless `enable: true`.
#
# What it does when enabled:
#   - Memory: every conversation turn is still written to the local JSONL store
#     (the source of truth) and is additionally submitted to OpenViking, where
#     it is extracted into long-term memory. Facts (`/remember`) also go to a
#     plain journal file, which works even when OpenViking's VLM model is not
#     activated on your account. Recall prefers semantic search and falls back
#     to the local keyword index.
#   - Documents: `save_document` (a tool the model can call), `huan-agent viking
#     save`, the console, and the workspace sync all write into one viking://
#     subtree, where they stay searchable in later conversations.
#   - Tools: OpenViking's own MCP server is registered automatically, giving the
#     model find/read/write/add_resource.
#
# OpenViking being down never blocks a conversation: the local store still has
# everything and the failure is reported by `huan-agent viking status` and in
# 设置 → OpenViking.
#   HUAN_OPENVIKING_ENABLE=true
#   HUAN_OPENVIKING_BASE_URL=http://127.0.0.1:1933
openviking:
  enable: false                       # off by default; a machine without the server is unaffected
  base_url: "http://127.0.0.1:1933"   # a local `ov` server
  api_key: ""                         # user key; required when the server runs auth_mode=api_key.
                                      # Empty = dev auth, which only a server bound to loopback still allows.
                                      # Set via env: HUAN_OPENVIKING_API_KEY
  account: "default"                  # X-OpenViking-Account; ignored by the server in api_key mode
  user: "default"                     # X-OpenViking-User; data is scoped under viking://user/<user>
  timeout_seconds: 0                  # HTTP client timeout; 0 = auto (index_wait_seconds + 15s).
                                      # Never takes effect below index_wait_seconds + 15s: if the client
                                      # gave up first you would see "context deadline exceeded" rather
                                      # than the server's own 504, and could not tell a slow index apart
                                      # from an unreachable server.
  index_wait_seconds: 30              # how long a write may wait for OpenViking's index queue (the
                                      # "timeout" the server honours). A local `ov` needs ~15-17s to get
                                      # a small document through semantic extraction plus embedding, so
                                      # 30s covers a slow cycle. Raise it if `ov observer queue` shows
                                      # the semantic queue still draining when writes give up.

  memory:
    enable: true
    # Ask OpenViking to extract long-term memory from submitted turns. Requires
    # its VLM model to be available on your account (`ov task list` shows the
    # extraction task; `ModelNotOpen` means it is not activated).
    commit: true
    flush_every: 4        # batch this many messages per submission (0 = every turn)
    recall_enable: true   # semantic recall, with the local keyword index as fallback
    recall_limit: 5
    recall_target: ""     # empty = viking://user/<user>/huan-agent
    journal_enable: true  # VLM-independent append-only fact journal
    session_prefix: "huan-agent"

  documents:
    enable: true
    root_uri: ""              # empty = viking://user/<user>/huan-agent
    sync_workspace: true      # publish workspace files
    workspace_dir: ""         # empty = tools.workspace; both empty = sync disabled
    # Glob patterns over workspace-relative paths. "**" crosses directories, and
    # a pattern without "/" (e.g. "*.log") also matches the file name at any depth.
    include: []
    exclude: []
    max_file_kb: 512          # per-file cap
    binary_mode: "skip"       # skip | upload (upload sends binaries through temp_upload + add_resource)
    wait_index: false         # saved documents always wait for indexing; bulk syncs do not
    sync_interval_seconds: 0  # >0 = background sync on that period (serve)
    sync_on_exit: true        # incremental sync when an interactive chat ends
    state_path: "./data/openviking-docs.json"   # incremental sync state (uri -> content hash)

  mcp:
    register: true            # register <base_url>/mcp as an MCP server
    name: "openviking"        # an entry with this name declared under mcp.servers wins

# ClaudeCode compatibility mode.
#
# Reads Claude Code's own settings file and runs this agent on it: the model
# mapping (`env`: endpoint, credential, models) and the hooks registered on five
# of Claude Code's events. The switch itself is in 设置 → ClaudeCode, which
# stores its choice in the database; `enable` below is only the state a fresh
# database starts in.
#
# While the mode is on, EVERY conversation runs on the model the settings file
# names — overriding the per-conversation choice in 对话 — and the hooks fire at
# SessionStart / UserPromptSubmit / PreToolUse / PostToolUse / Stop. Full detail,
# including the tool-name translation and what is deliberately not wired:
# docs/claudecode.md
#
#   HUAN_CLAUDECODE_ENABLE=true
#   HUAN_CLAUDECODE_SETTINGS_PATH=~/.claude/settings.json
claudecode:
  enable: false              # startup state; the console's switch overrides it at runtime
  settings_path: ""          # empty = ~/.claude/settings.json
  hooks: true                # false = switch the model only, run no hook. Separate from the
                             # mode because the two halves carry different risks: the model
                             # half changes who is billed, the hook half runs whatever
                             # commands the file names on every tool call.
  hook_timeout_seconds: 600  # ceiling on one handler, whatever its own `timeout` says
                             # (600 = Claude Code's own default)
  reload_seconds: 15         # how often the file's mtime is checked; always re-read on
                             # demand (the console's 重新读取 and a change of the mode)
